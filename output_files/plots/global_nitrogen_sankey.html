        document.getElementById('btn-play').onclick = play;
        document.getElementById('btn-pause').onclick = pause;
        document.getElementById('btn-species').onclick = function() { setMode('species'); };
        document.getElementById('btn-category').onclick = function() { setMode('category'); };

        plotWrapper.parentNode.style.position = 'relative';
        var legendDiv = document.createElement('div');

        legendDiv.style.fontSize = '12px';
        legendDiv.style.background = 'rgba(255,255,255,0.85)';
        legendDiv.style.padding = '8px 10px';
        legendDiv.style.border = '1px solid #ccc';
        legendDiv.style.borderRadius = '4px';
        legendDiv.innerHTML =
            '<div id="legend-species" style="display:block;"><b>N species</b><div style="margin-bottom:3px;"><span style="display:inline-block;width:12px;height:12px;background:rgba(156, 39, 176, 1.0);margin-right:6px;border-radius:2px;"></span>N2O</div><div style="margin-bottom:3px;"><span style="display:inline-block;width:12px;height:12px;background:rgba(140, 140, 140, 1.0);margin-right:6px;border-radius:2px;"></span>N2 (excl. NOx)</div><div style="margin-bottom:3px;"><span style="display:inline-block;width:12px;height:12px;background:rgba(255, 152, 0, 1.0);margin-right:6px;border-radius:2px;"></span>NH3 / RDN</div><div style="margin-bottom:3px;"><span style="display:inline-block;width:12px;height:12px;background:rgba(244, 67, 54, 1.0);margin-right:6px;border-radius:2px;"></span>NOx / OXN</div><div style="margin-bottom:3px;"><span style="display:inline-block;width:12px;height:12px;background:rgba(76, 175, 80, 1.0);margin-right:6px;border-radius:2px;"></span>Nmix</div><div style="margin-bottom:3px;"><span style="display:inline-block;width:12px;height:12px;background:rgba(33, 150, 243, 1.0);margin-right:6px;border-radius:2px;"></span>Other</div></div>' +
            '<div id="legend-category" style="display:none;"><b>Category</b><div style="margin-bottom:3px;"><span style="display:inline-block;width:12px;height:12px;background:rgba(76, 175, 80, 1.0);margin-right:6px;border-radius:2px;"></span>useful output</div><div style="margin-bottom:3px;"><span style="display:inline-block;width:12px;height:12px;background:rgba(244, 67, 54, 1.0);margin-right:6px;border-radius:2px;"></span>N wasted</div><div style="margin-bottom:3px;"><span style="display:inline-block;width:12px;height:12px;background:rgba(33, 150, 243, 1.0);margin-right:6px;border-radius:2px;"></span>import</div><div style="margin-bottom:3px;"><span style="display:inline-block;width:12px;height:12px;background:rgba(255, 152, 0, 1.0);margin-right:6px;border-radius:2px;"></span>recycling</div><div style="margin-bottom:3px;"><span style="display:inline-block;width:12px;height:12px;background:rgba(160, 160, 160, 1.0);margin-right:6px;border-radius:2px;"></span>other/unclassified</div></div>';
        plotWrapper.parentNode.insertBefore(legendDiv, plotWrapper.nextSibling);
